[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "CR_Agent"
version = "0.1.0"
description = "Deterministic Clash Royal simulator and RL agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "torch",
]
# Phase 13 only. Leave this as a placeholder until you get there.
live = []

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]